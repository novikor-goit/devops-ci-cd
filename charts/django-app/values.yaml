replicaCount: 1

image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.eu-north-1.amazonaws.com/lesson-5-ecr
  pullPolicy: Always
  tag: "latest"

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70

configMap:
  ALLOWED_HOSTS: "*"
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_USER: user
  POSTGRES_DB: db

secret:
  POSTGRES_PASSWORD: ""  # Override: --set secret.POSTGRES_PASSWORD=yourpassword

